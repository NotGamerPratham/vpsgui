<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 H0 V64" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414" stop-opacity="0" />
      <stop offset="100%" stop-color="#141414" stop-opacity="1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#141414" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#fade)" />

  <g transform="translate(88, 88)">
    <g stroke="#f5f5f5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M2 6 L11 15 L2 24" />
      <path d="M16 24.5 H26" />
    </g>
    <text x="42" y="22" font-family="Geist, Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#f5f5f5">vpsgui</text>
  </g>

  <text x="88" y="300" font-family="Geist, Inter, system-ui, sans-serif" font-size="76" font-weight="500" letter-spacing="-1.8" fill="#fafafa">Run your Linux servers</text>
  <text x="88" y="384" font-family="Geist, Inter, system-ui, sans-serif" font-size="76" font-weight="500" letter-spacing="-1.8" fill="#fafafa">from a <tspan font-family="Instrument Serif, Georgia, serif" font-style="italic" font-weight="400">browser tab</tspan>.</text>

  <text x="88" y="446" font-family="Geist, Inter, system-ui, sans-serif" font-size="22" fill="#a3a3a3">Self-hosted control plane for Linux and Docker. Reads the machine directly.</text>

  <text x="88" y="536" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">MIT &#183; 46 endpoints &#183; no account, no telemetry</text>
  <text x="1112" y="536" text-anchor="end" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">github.com/NotGamerPratham/vpsgui</text>

  <rect x="88" y="566" width="1024" height="1" fill="#ffffff" fill-opacity="0.1" />
</svg>
