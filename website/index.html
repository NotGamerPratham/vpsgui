    <!--
      Paint the page background before the bundle parses. Without this the
      browser flashes white for a frame on a dark-themed site, which reads as
      a broken load. Mirrors the persisted choice in src/hooks/use-theme.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('vpsgui-site-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored ? stored === 'dark' : true;
          if (stored === 'system') dark = prefersDark;
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.backgroundColor = dark ? '#161616' : '#f3f3f3';
        } catch (e) {
          /* Private-mode localStorage throws. The class on <html> already
             defaults to dark, so failing here is harmless. */
        }
      })();
    </script>
