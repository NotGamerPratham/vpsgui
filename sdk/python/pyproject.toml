[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpsgui"
version = "1.1.0"
description = "Official Python SDK for the VPSGUI REST API - manage VPS nodes, Docker containers, telemetry, files, security, and more."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "NotGamerPratham", email = "contact@notgamerpratham.com"},
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "vpsgui", "vps", "server", "infrastructure", "docker",
    "linux", "monitoring", "telemetry", "devops", "sdk", "api-client",
]

[project.urls]
Homepage = "https://github.com/NotGamerPratham/vpsgui"
Documentation = "https://github.com/NotGamerPratham/vpsgui/tree/main/sdk/python"
Repository = "https://github.com/NotGamerPratham/vpsgui"
"Bug Tracker" = "https://github.com/NotGamerPratham/vpsgui/issues"
