[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vpsgui"
version = "1.2.0"
description = "Official CLI and Python SDK for the VPSGUI agent - sign in to a host, read telemetry, run commands, and drive Docker, files, security and backups."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "NotGamerPratham", email = "contact@notgamerpratham.com"},
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "vpsgui", "vps", "server", "infrastructure", "docker", "cli",
    "linux", "monitoring", "telemetry", "devops", "sdk", "api-client",
]

[project.scripts]
vpsgui = "vpsgui.cli:main"

[project.urls]
Homepage = "https://github.com/NotGamerPratham/vpsgui"
Documentation = "https://github.com/NotGamerPratham/vpsgui/tree/main/sdk/python"
Repository = "https://github.com/NotGamerPratham/vpsgui"
"Bug Tracker" = "https://github.com/NotGamerPratham/vpsgui/issues"
