name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` requires package-lock.json to be in sync with package.json, which also catches
      # dependency drift in PRs.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (src and tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The agent suite boots the real daemon on a loopback port and exercises authentication,
      # path confinement, and input validation.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  bun:
    name: Bun runs the same suite
    runs-on: ubuntu-latest

    # Bun is supported alongside Node, not instead of it. This job exists because
    # the two runtimes are not identical in practice: Bun's fs.realpath returned
    # a Windows drive root without its trailing separator, which made the agent's
    # path-confinement check refuse the configured root outright. Nothing but
    # actually running the agent under Bun catches that class of divergence.
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun.lock is committed alongside package-lock.json so this job installs
      # exactly what a contributor on Bun gets. CI sets CI=true, which makes
      # `bun install` frozen by default - so a lockfile that has drifted from
      # package.json fails here rather than silently resolving something else.
      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build the console
        run: bun run build

      # --bun forces Bun to execute Vite too. Without it, Bun honours the
      # `#!/usr/bin/env node` shebang on the Vite binary and the build silently
      # runs on Node, which would make this job prove nothing.
      - name: Build the website end to end under Bun
        working-directory: website
        run: |
          bun install
          bun --bun run build
          test -f dist/index.html
          test -f dist/docs/index.html
          test -f dist/docs.html
          test -f dist/sitemap.xml

      - name: Agent starts under Bun and confines paths correctly
        env:
          AGENT_TOKEN: ci-token-0123456789abcdef
          AGENT_HOST: 127.0.0.1
          PORT: '46510'
        run: |
          bun agent/server.js &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:46510/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:46510/api/v1/health | grep -q '"status":"ok"'

          # The configured root must be listable. This is the assertion that
          # fails when realpath normalisation regresses.
          curl -fsS -H 'Authorization: Bearer ci-token-0123456789abcdef' \
            'http://127.0.0.1:46510/api/v1/files?path=%2F' | grep -q '"name"'

          # And the token must still be enforced under Bun.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:46510/api/v1/system/telemetry)
          if [ "$code" != "401" ]; then
            echo "FAIL: unauthenticated telemetry returned $code, expected 401" >&2
            exit 1
          fi

  agent-smoke:
    name: Agent starts and gates access
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Guards the deployment path that actually broke in production: the agent failing to start,
      # or serving privileged endpoints without a token.
      - name: Start agent
        env:
          AGENT_TOKEN: ci-token-0123456789abcdef
          AGENT_HOST: 127.0.0.1
          PORT: '46509'
        run: |
          node agent/server.js &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:46509/api/v1/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Agent failed to become healthy" >&2
          exit 1

      - name: Privileged endpoints must reject an unauthenticated caller
        run: |
          for endpoint in system/telemetry system/processes docker/containers node files; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:46509/api/v1/$endpoint")
            if [ "$code" != "401" ]; then
              echo "FAIL: /$endpoint returned $code, expected 401" >&2
              exit 1
            fi
          done
          echo "All privileged endpoints correctly returned 401."

      - name: Authenticated caller receives real telemetry
        run: |
          curl -fsS -H 'Authorization: Bearer ci-token-0123456789abcdef' \
            http://127.0.0.1:46509/api/v1/system/telemetry | grep -q '"cpuPercent"'

  sdks:
    name: SDKs compile and match the agent API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The SDKs drifted badly once before: the Python client called endpoints such as
      # /docker/containers/{id}/start and /nodes/{id}/reboot that the agent has never served, so
      # most calls would have failed at runtime. These steps compile both and exercise them against
      # a real agent.
      - name: Build the Node SDK
        working-directory: sdk/node
        run: npm install && npx tsc

      - name: Install Python SDK dependencies
        run: pip install requests

      - name: Start the agent
        env:
          AGENT_TOKEN: ci-token-0123456789abcdef
          AGENT_HOST: 127.0.0.1
          PORT: '46509'
        run: |
          node agent/server.js &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:46509/api/v1/health >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "Agent failed to become healthy" >&2
          exit 1

      - name: Node SDK talks to the agent
        run: |
          node -e "
          const { VpsguiClient, VpsguiError } = require('./sdk/node/dist/index.js');
          (async () => {
            const c = new VpsguiClient({ baseUrl: 'http://127.0.0.1:46509/api/v1', token: 'ci-token-0123456789abcdef' });
            if ((await c.health()).status !== 'ok') throw new Error('health failed');
            if (!(await c.system.telemetry()).cpuCores) throw new Error('telemetry failed');
            if (!(await c.catalog.list()).length) throw new Error('catalog failed');
            const bad = new VpsguiClient({ baseUrl: 'http://127.0.0.1:46509/api/v1', token: 'wrong' });
            try { await bad.system.telemetry(); throw new Error('expected 401'); }
            catch (e) { if (!(e instanceof VpsguiError) || e.status !== 401) throw e; }
            console.log('Node SDK OK');
          })().catch(e => { console.error(e); process.exit(1); });
          "

      - name: Python SDK talks to the agent
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'sdk/python')
          from vpsgui import VpsguiClient, VpsguiError

          c = VpsguiClient(base_url="http://127.0.0.1:46509/api/v1", token="ci-token-0123456789abcdef")
          assert c.health()["status"] == "ok"
          assert c.system.telemetry()["cpuCores"] > 0
          assert len(c.catalog.list()) > 0

          bad = VpsguiClient(base_url="http://127.0.0.1:46509/api/v1", token="wrong")
          try:
              bad.system.telemetry()
              raise AssertionError("expected 401")
          except VpsguiError as e:
              assert e.status == 401 and e.is_auth_error
          print("Python SDK OK")
          PY
