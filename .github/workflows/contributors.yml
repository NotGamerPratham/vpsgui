name: Contributors

# Keeps the contributor table in README.md in step with the GitHub API.
#
# This exists instead of an image service (contrib.rocks and similar) because
# those query the public API anonymously: against a private repository they
# return 404 and the README shows a broken image. Running here means the request
# carries GITHUB_TOKEN, which can read this repo whether it is private or public.
on:
  push:
    branches: [main]
  schedule:
    # Daily. A push by a first-time contributor updates the table immediately via
    # the trigger above; this catches everything else (reverted commits, renames).
    - cron: '17 4 * * *'
  workflow_dispatch:

# Two runs committing to main at once would conflict. Let the newer one win -
# the table is derived state, so a superseded run has nothing worth finishing.
concurrency:
  group: contributors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Refresh the contributor table
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate from the GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/update-contributors.mjs

      - name: Commit only when the table actually changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No contributor changes."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          # [skip ci] so this commit does not retrigger the workflows that run on
          # push to main - it changes nothing they test.
          git commit -m "docs: refresh contributor table [skip ci]"
          git push
