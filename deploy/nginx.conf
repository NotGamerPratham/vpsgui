# VPSGUI nginx site configuration
#
# SECURITY: the /api/v1/ location proxies to the vpsgui-agent, which can execute shell commands,
# install packages, and read/write files on the host. Anyone who reaches this vhost with a valid
# agent token controls the machine. Serve it over TLS — see the commented HTTPS block below — and
# restrict access with `allow`/`deny` or a VPN wherever possible.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # --- TLS ---------------------------------------------------------------
    # The agent token is sent as a bearer header on every request. Over plain HTTP it is readable
    # by anything on the network path. Once you have a certificate (e.g. `certbot --nginx`),
    # replace this whole server block's listener with the HTTPS block at the bottom of this file.

    root /var/www/vpsgui/dist;
    index index.html;

    # Uploaded/edited file payloads go through /api/v1/files/write; the agent caps bodies at 8 MiB.
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml
               application/xml+rss text/javascript image/svg+xml;

    # --- Security headers --------------------------------------------------
    # `always` so they are emitted on error responses too. X-XSS-Protection is deliberately omitted:
    # it is deprecated and can itself introduce vulnerabilities in older browsers.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), microphone=(), geolocation=()" always;
    # connect-src permits arbitrary http/https origins because the Diagnostics page probes
    # user-entered hosts by design. If you do not need that page, tighten it to:
    #   connect-src 'self' https://cloudflare-dns.com https://api.ipify.org https://ipapi.co;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker must never be cached, or clients pin an old app shell forever.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # --- Agent REST proxy --------------------------------------------------
    location /api/v1/ {
        proxy_pass http://127.0.0.1:46509/api/v1/;
        proxy_http_version 1.1;
        # $http_host preserves the port the client actually connected on; $host strips it, which
        # made the agent's same-origin check disagree with the browser's Origin header on any
        # deployment not running on the default port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The agent authenticates with a bearer token; pass it through untouched.
        proxy_set_header Authorization $http_authorization;

        # `apt-get install` can legitimately run for minutes; the agent caps it at 300s.
        proxy_connect_timeout 10s;
        proxy_send_timeout 310s;
        proxy_read_timeout 310s;

        # Host telemetry, file contents, and process lists must never be cached by nginx or by any
        # intermediary. The agent also sets no-store itself; this is belt and braces.
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    }

    # NOTE: there is deliberately no /ws location. The bundled agent is a plain HTTP daemon with no
    # WebSocket endpoint, so the previous `proxy_pass http://127.0.0.1:46509/ws` produced a 404 on
    # every upgrade attempt. The UI polls REST telemetry instead.

    # Do not serve dotfiles (.env, .git, .agent-token) if any land in the web root.
    location ~ /\. {
        deny all;
        return 404;
    }
}

# --- HTTPS template -----------------------------------------------------------
# Recommended production setup. Replace the HTTP server above with a redirect-only block:
#
# server {
#     listen 80 default_server;
#     listen [::]:80 default_server;
#     server_name vps.example.com;
#     return 301 https://$host$request_uri;
# }
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name vps.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/vps.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/vps.example.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_prefer_server_ciphers off;
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#     # ... copy the root, headers, and location blocks from the server above ...
# }
